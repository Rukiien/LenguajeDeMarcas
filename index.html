<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>SquirtPedia</title>
    <link rel="stylesheet" href="estilomain.css">
</head>
<body>
    <header>
        <h1>SQUIRTPEDIA</h1>
        <nav>
            <button onclick="window.location.href='tabladeEstados.html'">Efectos de Estado</button>
            <button onclick="window.location.href='tabladeTipos.html'">Tabla de tipos</button>
            <button onclick="window.location.href='tablaRegiones.html'">Tabla de regiones</button>
            <button onclick="window.location.href='guia.html'">Guias</button>
            <button onclick="window.location.href='tiendadepeluches.html'">Tienda de peluches</button>
        </nav>
    </header>

    <button id="openPopup" class="open-btn">Inicio de sesión</button>

    <main>
        <p><i><strong>Guía básica sobre conocimientos Pokémon.</strong></i></p>
        <img src="Imagenes/SquirtPediaSinFondo.png" height="300" width="300" />
    </main>

    <!-- Pop-up Lateral con LOGIN -->
    <div id="sidebarPopup" class="sidebar-popup">
        <div class="popup-content">
            <div class="popup-header">
                <h2>~Iniciar Sesión~</h2>
                <button id="closePopup" class="close-btn">&times;</button>
            </div>
            <div class="popup-body">
                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="nombre123@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                        <div class="password-toggle">
                            <span img src="Imagenes/Unown_ojo_abierto.webp" alt="Mostrar contraseña" class="eye-icon" id="eyeIcon"></span>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Recordar sesión
                        </label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="login-btn">Iniciar Sesión</button>
                </form>

                <div class="divider">
                    <span>o</span>
                </div>

                <button class="register-btn">Crear Cuenta</button>
            </div>
        </div>
    </div>

    <footer>
    <h1>Proyecto Squirtpedia</h1>
    <p class="small">Squirtpedia es un proyecto de Fco Redondo y Alvaro Almoguera</p>
    <p class="small">DAM | Lenguajes de Marcas curso 2025 / 2026</p>
</footer>

    <div id="overlay" class="overlay"></div>

    <script src="JavaIndex.js"></script>
</body>
</html>
